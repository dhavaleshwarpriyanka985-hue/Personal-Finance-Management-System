<form method="POST">

    <label>Title</label>
    <input type="text" name="title" value="{{ income.title }}" required>

    <label>Amount</label>
    <input type="number" step="0.01" name="amount" value="{{ income.amount }}" required>

    <label>Category</label>
    <input type="text" name="category" value="{{ income.category }}" required>

    <label>Transaction Date</label>
    <input type="date" name="transaction_date"
           value="{{ income.transaction_date }}" required>

    <button type="submit">Update Income</button>

</form>
