```html
<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
</head>
<body>

    <h2>Edit Expense</h2>

    <form method="POST">

        <label>Title:</label>
        <input type="text" name="title" value="{{ expense.title }}" required>
        <br><br>

        <label>Amount:</label>
        <input type="number" step="0.01" name="amount" value="{{ expense.amount }}" required>
        <br><br>

        <label>Category:</label>
        <input type="text" name="category" value="{{ expense.category }}" required>
        <br><br>

        <label>Date:</label>
        <input type="date" name="transaction_date"
               value="{{ expense.transaction_date }}" required>
        <br><br>

        <button type="submit">Update Expense</button>

    </form>

    <br>

   <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

</body>
</html>
```
